name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The API key is uploaded with the deployment itself. A separate
      # `wrangler secret put` fails whenever another build (Cloudflare's Git
      # integration) has uploaded a newer version in the meantime.
      - name: Deploy to Cloudflare Workers
        run: |
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          jq -n --arg key "$ANTHROPIC_API_KEY" '{ANTHROPIC_API_KEY: $key}' > "$RUNNER_TEMP/secrets.json"
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEPLOY_ARGS: --secrets-file ${{ runner.temp }}/secrets.json
